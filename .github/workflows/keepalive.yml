name: Keep Render Alive

on:
  schedule:
    - cron: '*/2 * * * *'   # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl -sSf https://choudhary-realties-backend.onrender.com/api/health || echo "Ping failed"
